name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m pytest
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: powershell
        run: ./scripts/build-installer.ps1 -PythonPath (Get-Command python).Source
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Yantu-Windows-${{ github.ref_name }}
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -Path "dist/installer/*.exe", "dist/installer/*.sha256" -File |
              Select-Object -ExpandProperty FullName
          )
          if ($assets.Count -eq 0) {
            throw "No installer assets were found."
          }
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            $assetCount = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" --jq ".assets | length"
            if ([int]$assetCount -eq 0) {
              gh release delete $env:GITHUB_REF_NAME --yes
            } else {
              gh release upload $env:GITHUB_REF_NAME @assets --clobber
              exit 0
            }
          }
          gh release create $env:GITHUB_REF_NAME @assets --title "Yantu $env:GITHUB_REF_NAME" --generate-notes --latest
