name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m pytest
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: powershell
        run: ./scripts/build-installer.ps1 -PythonPath (Get-Command python).Source
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Yantu-Windows-${{ github.ref_name }}
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path "dist/installer/*.exe" -File | Select-Object -ExpandProperty FullName -First 1
          $checksum = Get-ChildItem -Path "dist/installer/*.sha256" -File | Select-Object -ExpandProperty FullName -First 1
          if (-not $installer -or -not $checksum) { throw "Installer assets were not found." }
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            $assetCount = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" --jq ".assets | length"
            if ([int]$assetCount -eq 0) {
              throw "The release already exists without assets. Publish with a new tag."
            }
            exit 0
          }
          $releaseId = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases" `
            -f "tag_name=$env:GITHUB_REF_NAME" -f "name=Yantu $env:GITHUB_REF_NAME" `
            -F draft=true -F prerelease=false -F generate_release_notes=true --jq ".id"
          if ($LASTEXITCODE -ne 0 -or -not $releaseId) { throw "Could not create the draft release." }
          $uploadHeaders = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          foreach ($asset in @($installer, $checksum)) {
            $assetName = [System.Uri]::EscapeDataString((Split-Path -Leaf $asset))
            $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?name=$assetName"
            $uploaded = Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers $uploadHeaders `
              -ContentType "application/octet-stream" -InFile $asset
            if (-not $uploaded.id) { throw "GitHub did not confirm release asset: $asset" }
          }
          $assetCount = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" --jq ".assets | length"
          if ($LASTEXITCODE -ne 0 -or [int]$assetCount -ne 2) { throw "Release asset verification failed." }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" `
            -F draft=false -f make_latest=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the completed draft release." }
