[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yantu"
version = "0.2.0"
description = "A local-first graduate student research and time management workbench"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Yantu contributors" }]
dependencies = [
  "Flask>=3.1,<4",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
yantu = "yantu.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yantu = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
