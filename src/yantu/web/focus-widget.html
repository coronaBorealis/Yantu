<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yantu 专注小窗</title>
  <link rel="stylesheet" href="focus-widget.css">
</head>
<body>
  <main>
    <div class="widget-head"><span>YANTU // FOCUS</span><button id="hide" aria-label="隐藏专注小窗">×</button></div>
    <div class="widget-core"><div class="widget-orbit"><time id="clock">--:--</time><span id="phase">等待专注</span></div></div>
    <p id="task">从主工作台开始一轮专注</p>
    <div class="widget-actions"><button id="pause" disabled>暂停</button><button id="return">返回主窗</button></div>
  </main>
  <script src="focus-widget.js"></script>
</body>
</html>
