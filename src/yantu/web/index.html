<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8f3">
  <title>研途 · 研究生个人工作台</title>
  <link rel="stylesheet" href="styles.css?v=20260811.3">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">研</span><div><strong>研途</strong><small>研究生个人工作台</small></div></div>
      <nav id="nav" aria-label="主导航">
        <button class="nav-item active" data-view="today"><span>⌂</span>今日</button>
        <button class="nav-item" data-view="inbox"><span>＋</span>收件箱 <b id="count-inbox">0</b></button>
        <p class="nav-label">领域</p>
        <button class="nav-item" data-view="research"><i class="dot research"></i>科研 <b id="count-research">0</b></button>
        <button class="nav-item" data-view="course"><i class="dot course"></i>课程 <b id="count-course">0</b></button>
        <button class="nav-item" data-view="personal"><i class="dot personal"></i>个人 <b id="count-personal">0</b></button>
        <p class="nav-label">规划</p>
        <button class="nav-item" data-view="week"><span>▦</span>未来 7 天</button>
        <button class="nav-item" data-view="month"><span>□</span>月历</button>
        <button class="nav-item" data-view="ai"><span>◇</span>AI 任务拆解</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="quiet-btn" id="export-btn">导出 SQLite 数据备份</button>
        <label class="quiet-btn file-btn">导入 JSON 备份<input type="file" id="import-file" accept="application/json"></label>
        <p><span class="storage-dot"></span>SQLite 本机持久化</p>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="打开菜单">☰</button>
        <div><p id="date-label"></p><h1 id="view-title">今日</h1></div>
        <div class="top-actions">
          <label class="compact-field"><span>状态</span><select id="status-filter"><option value="all">全部状态</option><option value="not_started">未开始</option><option value="in_progress">进行中</option><option value="waiting">等待</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></label>
          <label class="compact-field"><span>子分类</span><select id="subcategory-filter"><option value="all">全部</option></select></label>
          <button class="primary-btn" id="add-btn"><span>＋</span> 新建任务</button>
        </div>
      </header>
      <section id="content" class="content" aria-live="polite"><div class="loading">正在连接 Yantu 数据库…</div></section>
    </main>
  </div>

  <dialog id="task-dialog">
    <form id="task-form">
      <div class="dialog-head"><div><p>把想法变成下一步行动</p><h2 id="dialog-title">新建任务</h2></div><button type="button" class="icon-btn" id="close-dialog" aria-label="关闭">×</button></div>
      <input type="hidden" id="task-id">
      <label class="field full"><span>标题 *</span><input id="task-title" required maxlength="160" placeholder="例如：整理本周实验结果并准备组会汇报" autofocus></label>
      <div class="form-grid">
        <label class="field"><span>一级领域 *</span><select id="task-domain"><option value="research">科研</option><option value="course">课程</option><option value="personal">个人</option><option value="inbox">收件箱（稍后整理）</option></select></label>
        <label class="field"><span>二级分类 / 标签</span><input id="task-subcategory" maxlength="60" placeholder="论文阅读、实验、作业……"></label>
      </div>
      <label class="field full"><span>描述</span><textarea id="task-description" rows="2" maxlength="1000" placeholder="任务背景、完成标准或下一步行动"></textarea></label>
      <div class="form-grid three">
        <label class="field"><span>开始日期</span><input type="date" id="task-start-date"></label>
        <label class="field"><span>截止日期</span><input type="date" id="task-due-date"></label>
        <label class="field"><span>优先级</span><select id="task-priority"><option value="urgent">紧急</option><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></label>
      </div>
      <div class="form-grid three">
        <label class="field"><span>状态</span><select id="task-status"><option value="not_started">未开始</option><option value="in_progress">进行中</option><option value="waiting">等待</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></label>
        <label class="field"><span>完成度（%）</span><input type="number" id="task-progress" min="0" max="100" step="5" value="0"></label>
        <label class="field"><span>标签（逗号分隔）</span><input id="task-tags" maxlength="200" placeholder="导师, 组会"></label>
      </div>
      <div class="form-grid">
        <label class="field"><span>预计耗时（分钟）</span><input type="number" id="task-estimated" min="0" max="100000" step="5" value="60"></label>
        <label class="field"><span>实际耗时（分钟）</span><input type="number" id="task-actual" min="0" max="100000" step="5" value="0"></label>
      </div>
      <div class="repeat-row"><label><input type="checkbox" id="task-recurring"> 重复任务</label><input id="task-recurrence" maxlength="100" placeholder="例如：每月最后一个周五" disabled></div>
      <label class="field full"><span>备注</span><textarea id="task-notes" rows="2" maxlength="1000" placeholder="资料位置、临时提醒或复盘记录"></textarea></label>
      <div class="dialog-actions"><button type="button" class="danger-btn hidden" id="delete-btn">删除任务</button><span></span><button type="button" class="secondary-btn" id="cancel-btn">取消</button><button type="submit" class="primary-btn">保存任务</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js?v=20260811.3"></script>
</body>
</html>
